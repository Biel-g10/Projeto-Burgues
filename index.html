<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Projeto - Burguer</title>
</head>

<body>
    <div class="app-container">
        <header>
            <h1 class="h11">Projeto - Burguer - Biel</h1>
        </header>

        <main>
            <section>
                <div class="container-buttons">
                    <button class="show-all">Mostrar todo <br> ForEach</button>
                    <button class="map-all">Mapear <br> Map</button>
                    <button class="reduce-all">Somar tudo <br> Reduce</button>
                    <button class="filter-all">Filtrar <br> Filter</button>
                </div>
            </section>

            <ul class="menu-list">
                <p class="message">Clique em um botão para visualizar o cardápio 🍔</p>
            </ul>

            <section>
                <h2 class="cart-title">Carrinho 🛒</h2>
                <button class="clear-cart">Limpar Carrinho</button>
                <ul class="cart-list"></ul>
                <p class="cart-total">Total: R$ 0,00</p>
            </section>
        </main>

        <footer>
            <p>Desenvolvido por Biel 🚀</p>
        </footer>
    </div>
</body>
<script src="products.js"></script>
<script src="scripts.js"></script>

</html>
